name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, repair/verified-build]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          THESYS_API_KEY: ci-build-placeholder

  gui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.51.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production application
        run: npm run build
        env:
          THESYS_API_KEY: ci-runtime-placeholder

      - name: Start production server
        run: |
          THESYS_API_KEY=ci-runtime-placeholder npm start > /tmp/thesys-dashboard.log 2>&1 &
          echo $! > /tmp/thesys-dashboard.pid
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3000/dashboard > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/thesys-dashboard.log
          exit 1

      - name: Exercise dashboard in Chromium
        run: npx playwright test tests/gui-smoke.spec.js --reporter=line
        env:
          BASE_URL: http://127.0.0.1:3000

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/thesys-dashboard.log || true

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-gui-diagnostics
          path: test-results
          if-no-files-found: ignore

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/thesys-dashboard.pid ]; then
            kill "$(cat /tmp/thesys-dashboard.pid)" || true
          fi

  live-production-gui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.51.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for public deployment
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --show-error "$PREVIEW_URL/dashboard" > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Public deployment did not become reachable"
          exit 1
        env:
          PREVIEW_URL: https://thesys-c1-dashboard.vercel.app

      - name: Exercise deployed GUI and real Thesys API
        run: npx playwright test tests/live-preview.spec.js --reporter=line
        env:
          PREVIEW_URL: https://thesys-c1-dashboard.vercel.app

      - name: Upload live GUI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-production-gui-evidence
          path: |
            live-preview-dashboard.png
            live-preview-diagnostics.json
            test-results
          if-no-files-found: warn
          retention-days: 7

  # Deployments are handled automatically by the Vercel GitHub integration.
